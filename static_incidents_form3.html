<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Журнал инцидентов — статическое электричество</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --panel: #ffffff;
    --border: #d4d0c8;
    --accent: #e8451a;
    --accent2: #f7a800;
    --text: #1a1a18;
    --muted: #7a7870;
    --input-bg: #fafaf8;
    --row-hover: #fff8f0;
    --danger: #e8451a;
    --success: #1a7a3f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
  }

  /* HEADER */
  .header {
    max-width: 860px;
    margin: 0 auto 32px;
    border-left: 4px solid var(--accent);
    padding-left: 20px;
  }
  .header-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 6px;
  }
  .header p {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
  }
  .org-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
  }

  /* META */
  .meta-bar {
    max-width: 860px;
    margin: 0 auto 24px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .meta-field label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 4px;
  }
  .meta-field input, .meta-field select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .meta-field input:focus, .meta-field select:focus {
    border-color: var(--accent);
  }

  /* TABLE */
  .table-wrapper {
    max-width: 860px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .table-title {
    background: var(--text);
    color: #fff;
    padding: 10px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .table-title span { color: var(--accent2); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    background: #f0ede8;
    padding: 9px 10px;
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid #ece9e3;
    transition: background 0.1s;
  }
  tbody tr:hover { background: var(--row-hover); }
  tbody td { padding: 0; }
  tbody td input, tbody td select {
    width: 100%;
    padding: 9px 10px;
    border: none;
    border-right: 1px solid #ece9e3;
    background: transparent;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
  }
  tbody td input:focus, tbody td select:focus {
    background: #fff8f0;
    box-shadow: inset 0 0 0 1px var(--accent2);
  }
  tbody td:last-child input, tbody td:last-child select { border-right: none; }
  .row-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 9px 8px !important;
    width: 32px;
    border-right: 1px solid var(--border) !important;
    cursor: default;
  }
  .btn-del {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 16px;
    padding: 0 10px;
    line-height: 1;
    transition: color 0.15s;
    display: block;
    width: 100%;
    height: 100%;
  }
  .btn-del:hover { color: var(--danger); }

  /* ACTIONS */
  .actions {
    max-width: 860px;
    margin: 16px auto 0;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-add {
    background: var(--text);
    color: #fff;
  }
  .btn-add:hover { background: #333; }
  .btn-print {
    background: var(--accent);
    color: #fff;
  }
  .btn-print:hover { background: #c73a15; }
  .btn-export {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-export:hover { border-color: var(--text); }

  .counter-bar {
    max-width: 860px;
    margin: 16px auto 0;
    display: flex;
    gap: 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
  }
  .counter-item { color: var(--muted); }
  .counter-item b { color: var(--text); font-size: 20px; font-weight: 600; vertical-align: middle; margin-right: 4px; }
  .counter-item.red b { color: var(--accent); }
  .counter-item.yellow b { color: var(--accent2); }

  /* NOTES */
  .notes-section {
    max-width: 860px;
    margin: 24px auto 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent2);
    padding: 14px 16px;
  }
  .notes-section label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .notes-section textarea {
    width: 100%;
    min-height: 64px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    color: var(--text);
    padding: 8px 10px;
    resize: vertical;
    outline: none;
  }
  .notes-section textarea:focus { border-color: var(--accent2); }

  /* SIGN */
  .sign-row {
    max-width: 860px;
    margin: 24px auto 40px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 24px;
  }
  .sign-block label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .sign-line {
    border-bottom: 1px solid var(--text);
    height: 28px;
    position: relative;
  }
  .sign-line input {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    border: none;
    background: transparent;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 4px 0;
    outline: none;
  }

  /* PRINT */
  @media print {
    body { background: #fff; padding: 10mm; }
    .btn, .actions, .counter-bar { display: none; }
    .header, .meta-bar, .table-wrapper, .notes-section, .sign-row { max-width: 100%; }
    .table-wrapper { border: 1px solid #999; }
    table { font-size: 11px; }
    thead th { font-size: 9px; }
    tbody td input, tbody td select { font-size: 11px; border: none; pointer-events: none; }
    .btn-del { display: none; }
    .row-num { display: table-cell !important; }
  }

  .flash {
    animation: flashAnim 0.4s ease;
  }
  @keyframes flashAnim {
    0% { background: #fff8e0; }
    100% { background: transparent; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-label">Журнал учёта</div>
  <h1>Инциденты — статическое электричество</h1>
</div>


<div class="table-wrapper">
  <div class="table-title">
    Записи инцидентов &nbsp;<span id="incidentCount">0 записей</span>
  </div>
  <table>
    <thead>
      <tr>
        <th style="width:32px">#</th>
        <th style="width:90px">Дата</th>
        <th style="min-width:100px">ФИО</th>
        <th style="min-width:100px">Источник разряда</th>
        <th style="min-width:100px">Местоположение</th>
        <th style="min-width:80px">Последствия</th>
        <th style="width:30px"></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="actions">
  <button class="btn btn-add" onclick="addRow()">+ Добавить строку</button>
  <button class="btn btn-print" onclick="window.print()">↓ Печать / PDF</button>
  <button class="btn btn-export" id="btnExport" onclick="exportToSheets()">Экспорт</button>
  <span id="saveIndicator" style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#1a7a3f;opacity:0;transition:opacity 0.3s;margin-left:8px;">✓ сохранено</span>
</div>

<div class="counter-bar">
  <div class="counter-item red"><b id="cntTotal">0</b> инцидентов всего</div>
</div>


<script>
const SOURCES = ['— выберите —','Системный блок / ПК','Монитор','Ноутбук','Принтер / МФУ','Кресло','Дверная ручка','Стол / стойка','Другой сотрудник','Стена / перегородка','Металлический шкаф','Прочее'];
const TYPES   = ['— тип —','ПК / моноблок','Ноутбук','Принтер / МФУ','Сервер / ИБП','Монитор','Смартфон / планшет','Мебель','Не связан с техникой','Прочее'];
const CONSEQ  = ['— последствия —','Неприятный укол, без последствий','Перезагрузка ПК','ПК ушёл в сон / защиту','Синий экран / BSOD','Потеря данных / файлов','Выход из строя устройства','Прочее'];

let rows = [];
let idCounter = 0;

function today() {
  const d = new Date();
  return d.toLocaleDateString('ru-RU');
}

function addRow(animate) {
  idCounter++;
  const id = idCounter;
  rows.push({ id, date: today(), name: '', source: '', location: '', conseq: '' });
  renderTable();
  if (animate !== false) {
    const lastRow = document.querySelector(`tr[data-id="${id}"]`);
    if (lastRow) { lastRow.classList.add('flash'); setTimeout(() => lastRow.classList.remove('flash'), 400); }
  }
}

function removeRow(id) {
  rows = rows.filter(r => r.id !== id);
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  rows.forEach((row, i) => {
    const tr = document.createElement('tr');
    tr.dataset.id = row.id;
    tr.innerHTML = `
      <td class="row-num">${i+1}</td>
      <td><input type="text" value="${row.date}" oninput="updateField(${row.id},'date',this.value)" onkeydown="maskDate(event,this)" placeholder="дд.мм.гггг" maxlength="10"></td>
      <td><input type="text" value="${row.name}" oninput="updateField(${row.id},'name',this.value)" placeholder="Иванов И.И."></td>
      <td><input type="text" value="${row.source}" oninput="updateField(${row.id},'source',this.value)" placeholder="дверная ручка, ПК..."></td>
      <td><input type="text" value="${row.location}" oninput="updateField(${row.id},'location',this.value)" placeholder="кухня, склад, кабинет..."></td>
      <td><select onchange="updateField(${row.id},'conseq',this.value)">${CONSEQ.map(s=>`<option${s===row.conseq?' selected':''}>${s}</option>`).join('')}</select></td>
      <td><button class="btn-del" onclick="removeRow(${row.id})" title="Удалить">×</button></td>
    `;
    tbody.appendChild(tr);
  });
  updateCounters();
  document.getElementById('incidentCount').textContent = rows.length + ' ' + plural(rows.length, 'запись','записи','записей');
}

function updateField(id, field, val) {
  const row = rows.find(r => r.id === id);
  if (row) row[field] = val;
  updateCounters();
}

function updateCounters() {
  document.getElementById('cntTotal').textContent = rows.length;
}

function plural(n, one, few, many) {
  const m = n % 10, h = n % 100;
  if (m===1 && h!==11) return one;
  if (m>=2 && m<=4 && (h<10||h>=20)) return few;
  return many;
}

function exportCSV() {
  const header = ['№','Дата','ФИО','Источник разряда','Местоположение','Последствия'];
  const lines = [header.join(';')];
  rows.forEach((r,i) => {
    lines.push([i+1, r.date, r.name, r.source, r.location, r.conseq].join(';'));
  });
  const blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'incidents_static.csv'; a.click();
}

const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzJVQfk-1M2i8vYFA7fMZ1ICpouv4Skm5D6xB94y-J0UV_MSzLuQu0Ixt8ryhKTjC3o/exec';

async function exportToSheets() {
  const btn = document.getElementById('btnExport');
  const indicator = document.getElementById('saveIndicator');

  const data = rows
    .filter(r => r.date || r.name || r.source)
    .map((r, i) => [i+1, r.date, r.name, r.source, r.location, r.conseq]);

  if (data.length === 0) {
    alert('Нет данных для экспорта — заполните хотя бы одну строку.');
    return;
  }

  btn.textContent = '⏳ Отправка...';
  btn.disabled = true;

  try {
    await fetch(SHEETS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    indicator.textContent = '✓ отправлено в таблицу';
    indicator.style.color = '#1a7a3f';
    indicator.style.opacity = '1';
    clearTimeout(indicator._t);
    indicator._t = setTimeout(() => { indicator.style.opacity = '0'; }, 3000);
    // Очищаем форму после успешного экспорта
    rows = []; idCounter = 0;
    addRow(false);
    localStorage.removeItem(STORAGE_KEY);
  } catch(e) {
    alert('Ошибка при отправке: ' + e.message);
  } finally {
    btn.textContent = 'Экспорт';
    btn.disabled = false;
  }
}

// ─── МАСКИ ВВОДА ───
function maskDate(e, input) {
  setTimeout(() => {
    let v = input.value.replace(/\D/g, '').slice(0, 8);
    let out = '';
    if (v.length >= 1) out = v.slice(0,2);
    if (v.length >= 3) out += '.' + v.slice(2,4);
    if (v.length >= 5) out += '.' + v.slice(4,8);
    input.value = out;
  }, 0);
}


// ─── СОХРАНЕНИЕ ───
const STORAGE_KEY = 'static_incidents_v1';

function save() {
  const state = {
    rows, idCounter,
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const el = document.getElementById('saveIndicator');
  if (el) { el.style.opacity = '1'; clearTimeout(el._t); el._t = setTimeout(() => el.style.opacity = '0', 1500); }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    rows = s.rows || []; idCounter = s.idCounter || 0;
    renderTable(); return true;
  } catch(e) { return false; }
}


// Перехватываем все изменения для автосохранения
const _updateField = updateField;
updateField = (id, field, val) => { _updateField(id, field, val); save(); };
const _removeRow = removeRow;
removeRow = (id) => { _removeRow(id); save(); };
const _addRow = addRow;
addRow = (animate) => { _addRow(animate); save(); };


// Init — восстанавливаем незаэкспортированные данные
if (!load()) { addRow(false); }
</script>
</body>
</html>
